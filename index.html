<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichas Técnicas & Food Cost</title>
<style>
:root{
  --navy:#0f2742;--navy-2:#163a63;--navy-3:#1f4b7e;--green:#15a06d;--green-2:#0f8a5d;--green-soft:#e5f5ee;
  --bg:#f3f5f8;--card:#fff;--text:#1b2633;--muted:#677689;--border:#dde3ea;--line:#eef1f5;
  --red:#cf3e3e;--red-soft:#fbeaea;--amber:#c98a00;--amber-soft:#fff5dc;--blue-soft:#eaf1fa;
  --radius:10px;--shadow:0 1px 2px rgba(15,39,66,.06),0 2px 8px rgba(15,39,66,.05);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
a{color:var(--navy-3)}
h1,h2,h3,h4{margin:0 0 .5em;color:var(--navy);line-height:1.25}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}h4{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
#app{display:flex;min-height:100vh}
#sidebar{width:248px;background:var(--navy);color:#cfdbea;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:30}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:.01em}
.brand span{font-size:12px;color:#8fa6c2}
.brand .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:7px}
#nav{padding:8px 8px 20px;flex:1}
#nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#cfdbea;text-decoration:none;font-size:13.5px;margin:1px 0}
#nav a:hover{background:rgba(255,255,255,.06);color:#fff}
#nav a.active{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 var(--green)}
#nav a .n{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:11px;font-weight:600}
#nav a.active .n{background:var(--green);color:#fff}
.side-foot{padding:12px 16px;font-size:11.5px;color:#8fa6c2;border-top:1px solid rgba(255,255,255,.08)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:20}
.topbar h1{margin:0;font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{display:none}
#view{padding:22px;max-width:1500px;width:100%}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.card.tight{padding:12px 14px}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2,.card-h h3{margin:0;flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--navy-3)}
.kpi.green:before{background:var(--green)}.kpi.red:before{background:var(--red)}.kpi.amber:before{background:var(--amber)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;color:var(--navy);margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;color:var(--navy);padding:7px 12px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#b9c4d2;background:#f8fafc}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy-2)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.green:hover{background:var(--green-2)}
.btn.danger{color:var(--red);border-color:#efc5c5}.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.icon{padding:5px 8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
input,select,textarea{font:inherit;font-size:13.5px;border:1px solid var(--border);border-radius:7px;padding:7px 9px;background:#fff;color:var(--text);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(21,160,109,.35);border-color:var(--green)}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--green);vertical-align:middle}
input.num{text-align:right}
input.bad,select.bad{border-color:var(--red);background:var(--red-soft)}
textarea{width:100%;min-height:80px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select{width:100%}
.field input[type=checkbox],.field input[type=radio]{width:16px;flex-shrink:0}
.filebtn{position:relative;overflow:hidden}
.filebtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.field .hint{font-size:11.5px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.search{min-width:220px}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:13px}
th{background:#f6f8fb;color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;position:sticky;top:0}
th.sortable{cursor:pointer}th.sortable:hover{color:var(--navy)}
td.r,th.r{text-align:right}
td.r{white-space:nowrap}td.c,th.c{text-align:center}
tr:hover td{background:#fafcfe}
tfoot td{font-weight:700;background:#f6f8fb}
td input{padding:4px 6px;font-size:13px}
td input.num{width:86px}
.muted{color:var(--muted)}.small{font-size:12px}.nowrap{white-space:nowrap}.b{font-weight:600}
.red{color:var(--red)}.green-t{color:var(--green-2)}.amber-t{color:var(--amber)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;background:#eef2f6;color:var(--navy);white-space:nowrap}
.badge.green{background:var(--green-soft);color:var(--green-2)}.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:#9a6a00}.badge.gray{background:#eef1f4;color:var(--muted)}.badge.blue{background:var(--blue-soft);color:var(--navy-3)}
.badge.demo{background:#fff1d6;color:#8a5a00;font-size:10px;padding:1px 6px;letter-spacing:.04em}
.alg{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;margin:1px;cursor:default}
.alg.trace{background:#fff!important;border:2px dashed currentColor}
.alg-list{display:flex;flex-wrap:wrap;gap:2px}
.alg-big{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
.alg-big .alg{width:30px;height:30px;font-size:13px}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;border:1px solid}
.alert.info{background:var(--blue-soft);border-color:#c9daf0;color:#1d3d63}
.alert.warn{background:var(--amber-soft);border-color:#f0dca5;color:#6b4c00}
.alert.err{background:var(--red-soft);border-color:#f0c5c5;color:#8a2323}
.alert.ok{background:var(--green-soft);border-color:#bfe6d5;color:#0d5e40}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--navy);border-bottom-color:var(--green);font-weight:600}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.sticky{position:sticky;top:76px}
.sumrow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.sumrow.total{font-weight:700;font-size:15px;border-bottom:0;border-top:2px solid var(--navy);margin-top:4px;padding-top:8px;color:var(--navy)}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tier{border:1px solid var(--border);border-radius:10px;padding:12px;background:#fff}
.tier.rec{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
.tier h3{margin:0 0 2px;font-size:14px}
.tier .price{font-size:24px;font-weight:700;color:var(--navy)}
.tier .row{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0}
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(15,39,66,.15);max-height:300px;overflow-y:auto;z-index:40;display:none}
.ac-list.show{display:block}
.ac-item{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px solid var(--line)}
.ac-item:hover,.ac-item.hl{background:var(--green-soft)}
.modal-bg{position:fixed;inset:0;background:rgba(10,25,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:1100px}.modal.small{max-width:460px}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-h h2{margin:0;flex:1}
.modal-b{padding:18px 20px;max-height:72vh;overflow-y:auto}
.modal-f{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast-root{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:13px;max-width:380px;animation:tin .2s ease}
.toast.err{background:var(--red)}.toast.ok{background:var(--green-2)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.chart{width:100%;height:auto;display:block}
.empty{padding:30px;text-align:center;color:var(--muted)}
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.step{padding:6px 12px;border-radius:20px;background:#eef2f6;font-size:12.5px;color:var(--muted)}
.step.active{background:var(--navy);color:#fff}.step.done{background:var(--green-soft);color:var(--green-2)}
.photo{width:100%;max-width:260px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--border);background:#f4f6f8}
.list-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.rcard{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.rcard .img{height:120px;background:linear-gradient(135deg,var(--navy-2),var(--navy-3));background-size:cover;background-position:center;position:relative}
.rcard .img .tag{position:absolute;left:8px;top:8px}
.rcard .body{padding:12px;flex:1}
.rcard .foot{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.rep-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rep-card{border:1px solid var(--border);border-radius:10px;padding:14px;background:#fff;cursor:pointer}
.rep-card:hover{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
.rep-card.active{border-color:var(--navy);box-shadow:0 0 0 2px var(--blue-soft)}
.rep-card b{display:block;color:var(--navy);margin-bottom:3px}
.diff-up{color:var(--red)}.diff-down{color:var(--green-2)}
.help{font-size:12.5px;color:var(--muted);background:#f7f9fb;border-left:3px solid var(--green);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0}
.sep{height:1px;background:var(--border);margin:14px 0}
.matrix td.c{padding:4px}
.inline-edit{width:90px}
#print-area{display:none}
@media (max-width:1100px){.editor{grid-template-columns:1fr}.sticky{position:static}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  #sidebar{position:fixed;left:-260px;transition:left .2s}
  #sidebar.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.35)}
  #menuBtn{display:inline-flex}
  #view{padding:14px}
  .g2,.g3,.tiers{grid-template-columns:1fr}
  .topbar{padding:0 12px}
  .search{min-width:0;width:100%}
}
@media (max-width:520px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:19px}.g4{grid-template-columns:1fr}}
/* ---------- Impressão ---------- */
.print-doc{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#111;font-size:11.5px}
.print-doc h1{font-size:20px;margin:0 0 4px;color:#0f2742}
.print-doc h2{font-size:14px;margin:14px 0 6px;color:#0f2742;border-bottom:2px solid #0f2742;padding-bottom:3px}
.print-doc table{width:100%;border-collapse:collapse;margin-bottom:8px}
.print-doc th,.print-doc td{border:1px solid #c9d1db;padding:4px 6px;font-size:11px}
.print-doc th{background:#e9eef4;color:#0f2742;position:static}
.print-doc .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px solid #15a06d;padding-bottom:8px;margin-bottom:10px}
.print-doc .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 14px;margin:6px 0}
.print-doc .meta div{border-bottom:1px dotted #bbb;padding:2px 0}
.print-doc .foot{margin-top:14px;font-size:10px;color:#666;border-top:1px solid #ccc;padding-top:4px}
.print-doc .alg{print-color-adjust:exact;-webkit-print-color-adjust:exact}
.print-doc .pbreak{page-break-after:always}
.print-doc .disclaimer{border:1px solid #c98a00;background:#fff8e5;padding:6px 8px;font-size:10.5px;margin-top:8px}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body.printing #app,body.printing #modal-root,body.printing #toast-root{display:none!important}
  body.printing #print-area{display:block}
  th{position:static}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><b><span class="dot"></span>FichaPro</b><span>Fichas técnicas &amp; Food Cost</span></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main>
    <header class="topbar">
      <button class="btn icon" id="menuBtn" aria-label="Menu">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <button class="btn sm" id="quickBackup" title="Exportar cópia de segurança">⤓ Cópia de segurança</button>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="print-area"></div>
<script>
/* =====================================================================
   MÓDULO 1 — UTILITÁRIOS E MOTOR DE CÁLCULO
   Lógica pura, sem dependência da interface (DOM). Pode ser reutilizada
   num servidor ou testada isoladamente.
   ===================================================================== */
'use strict';

const U = (() => {
  const nfEur = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nfEur4 = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 4 });
  const nfCache = {};
  const nf = (d) => nfCache[d] || (nfCache[d] = new Intl.NumberFormat('pt-PT', { minimumFractionDigits: d, maximumFractionDigits: d }));
  const nfMax = (d) => nfCache['m' + d] || (nfCache['m' + d] = new Intl.NumberFormat('pt-PT', { minimumFractionDigits: 0, maximumFractionDigits: d }));

  const ok = (n) => typeof n === 'number' && isFinite(n);
  const eur = (n) => ok(n) ? nfEur.format(n) : '—';
  const eur4 = (n) => ok(n) ? nfEur4.format(n) : '—';
  const num = (n, d = 2) => ok(n) ? nf(d).format(n) : '—';
  const numMax = (n, d = 3) => ok(n) ? nfMax(d).format(n) : '';
  const pct = (n, d = 1) => ok(n) ? nf(d).format(n) + ' %' : '—';

  /** Converte texto em número aceitando formato português (1.234,56) e internacional (1234.56). */
  function parseNum(v) {
    if (v === null || v === undefined) return NaN;
    if (typeof v === 'number') return v;
    let s = String(v).trim();
    if (!s) return NaN;
    s = s.replace(/[€%\s ]/g, '').replace(/eur$/i, '');
    if (!s) return NaN;
    const hasC = s.includes(','), hasD = s.includes('.');
    if (hasC && hasD) {
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else if (hasC) {
      if ((s.match(/,/g) || []).length > 1) s = s.replace(/,/g, '');
      else s = s.replace(',', '.');
    } else if (hasD && (s.match(/\./g) || []).length > 1) {
      s = s.replace(/\./g, '');
    }
    if (!/^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(s)) return NaN;
    return parseFloat(s);
  }
  /** Número para campo de formulário (vírgula decimal, sem separador de milhares). */
  const inNum = (n, d = 4) => ok(n) ? numMax(n, d).replace(/\s| | /g, '').replace(/\.(?=\d{3})/g, '') : '';

  const round = (n, d = 2) => ok(n) ? Math.round((n + Number.EPSILON) * 10 ** d) / 10 ** d : n;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const normalize = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const nowISO = () => new Date().toISOString();

  /** Aceita dd/mm/aaaa, dd-mm-aaaa, aaaa-mm-dd, número de série Excel e objetos Date. Devolve 'aaaa-mm-dd' ou null. */
  function parseDate(v) {
    if (v === null || v === undefined || v === '') return null;
    if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
    if (typeof v === 'number' || /^\d{5}(\.\d+)?$/.test(String(v).trim())) {
      const n = Number(v);
      if (n > 20000 && n < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000); return d.toISOString().slice(0, 10); }
      return null;
    }
    const s = String(v).trim();
    let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (m) return valid(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; return valid(y, +m[2], +m[1]); }
    return null;
    function valid(y, mo, d) {
      if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
      const dt = new Date(Date.UTC(y, mo - 1, d));
      if (dt.getUTCMonth() !== mo - 1) return null;
      return dt.toISOString().slice(0, 10);
    }
  }
  const fmtDate = (iso) => { if (!iso) return '—'; const s = String(iso).slice(0, 10).split('-'); return s.length === 3 ? `${s[2]}/${s[1]}/${s[0]}` : iso; };

const UNIT_SYNONYMS = {
  kg: ['kg', 'kgs', 'kilo', 'kilos', 'quilo', 'quilos', 'quilograma', 'quilogramas', 'kilograma'],
  g: ['g', 'gr', 'grs', 'grama', 'gramas'],
  l: ['l', 'lt', 'lts', 'litro', 'litros', 'ltr'],
  ml: ['ml', 'mililitro', 'mililitros'],
  cl: ['cl', 'centilitro', 'centilitros'],
  un: ['un', 'und', 'unid', 'unidade', 'unidades', 'uni', 'u', 'pc', 'pcs', 'peca', 'pecas', 'pç', 'ud'],
  dz: ['dz', 'duzia', 'duzias'],

/** Converte qty na unidade `unit` para a unidade base da dimensão `targetDim`.

  const v = qty * uu.f;

  const density = Number(conv.density) > 0 ? Number(conv.density) : 0;

}

      req.onblocked = () => reject(new Error('Base de dados bloqueada por outro separador'));
    });
  }
  tx(store, mode, fn) {
    return new Promise((resolve, reject) => {
      const t = this.db.transaction(store, mode);
      const s = t.objectStore(store);
      let out;
      Promise.resolve(fn(s)).then((v) => (out = v));
      t.oncomplete = () => resolve(out);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('Transação abortada'));
    });
  }
  getAll(store) { return new Promise((res, rej) => { const r = this.db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  put(store, obj) { return this.tx(store, 'readwrite', (s) => { s.put(obj); }); }
  bulkPut(store, arr) { return this.tx(store, 'readwrite', (s) => { arr.forEach((o) => s.put(o)); }); }
  delete(store, id) { return this.tx(store, 'readwrite', (s) => { s.delete(id); }); }
  bulkDelete(store, ids) { return this.tx(store, 'readwrite', (s) => { ids.forEach((id) => s.delete(id)); }); }

}
class LocalStorageAdapter {
  constructor(name) { this.name = name; this.kind = 'localStorage'; }
  async open() { return this; }
  key(s) { return this.name + ':' + s; }
  read(s) { try { return JSON.parse(localStorage.getItem(this.key(s)) || '{}'); } catch { return {}; } }
  write(s, o) { localStorage.setItem(this.key(s), JSON.stringify(o)); }
  async getAll(s) { return Object.values(this.read(s)); }
  async put(s, obj) { const o = this.read(s); o[obj.id] = obj; this.write(s, o); }
  async bulkPut(s, arr) { const o = this.read(s); arr.forEach((x) => (o[x.id] = x)); this.write(s, o); }
  async delete(s, id) { const o = this.read(s); delete o[id]; this.write(s, o); }
  async bulkDelete(s, ids) { const o = this.read(s); ids.forEach((id) => delete o[id]); this.write(s, o); }
  async clear(s) { this.write(s, {}); }
}

const Repo = (() => {
  let adapter = null;
  const cache = Object.fromEntries(STORES.map((s) => [s, new Map()]));
  const listeners = new Set();
  let persisted = null;

  async function init() {
    try { adapter = await new IDBAdapter('fichas-tecnicas-hotelaria').open(); }
    catch (e) { console.warn('IndexedDB falhou, a usar localStorage', e); adapter = await new LocalStorageAdapter('fichas-tecnicas-hotelaria').open(); }
    for (const s of STORES) { const all = await adapter.getAll(s); cache[s] = new Map(all.map((o) => [o.id, o])); }
    try { if (navigator.storage && navigator.storage.persist) persisted = await navigator.storage.persist(); } catch { persisted = null; }
    return adapter.kind;
  }
  const notify = (store) => listeners.forEach((fn) => fn(store));
  const all = (s) => [...cache[s].values()];
  const get = (s, id) => cache[s].get(id);
  const map = (s) => cache[s];
  async function save(s, obj) { if (!obj.id) obj.id = U.uid(); cache[s].set(obj.id, obj); await adapter.put(s, obj); notify(s); return obj; }
  async function saveMany(s, arr) { arr.forEach((o) => { if (!o.id) o.id = U.uid(); cache[s].set(o.id, o); }); await adapter.bulkPut(s, arr); notify(s); }
  async function remove(s, id) { cache[s].delete(id); await adapter.delete(s, id); notify(s); }
  async function removeMany(s, ids) { ids.forEach((id) => cache[s].delete(id)); await adapter.bulkDelete(s, ids); notify(s); }
  async function clearAll() { for (const s of STORES) { cache[s].clear(); await adapter.clear(s); } notify('*'); }

  function exportAll() {
    const out = { app: 'fichas-tecnicas-hotelaria', schema: SCHEMA_VERSION, exportedAt: U.nowISO(), data: {} };
    STORES.forEach((s) => (out.data[s] = all(s)));
    return out;
  }
  function validateBackup(obj) {
    if (!obj || obj.app !== 'fichas-tecnicas-hotelaria' || !obj.data) throw new Error('Ficheiro de cópia de segurança inválido');
    if (obj.schema > SCHEMA_VERSION) throw new Error('Cópia criada por uma versão mais recente da aplicação');
    for (const s of Object.keys(obj.data)) {
      if (!STORES.includes(s)) continue;
      if (!Array.isArray(obj.data[s])) throw new Error('Secção inválida: ' + s);
      if (obj.data[s].some((o) => !o || typeof o.id !== 'string')) throw new Error('Registos sem identificador em ' + s);
    }
  }
  async function importAll(obj, mode = 'replace') {
    validateBackup(obj);
    if (mode === 'replace') for (const s of STORES) { cache[s].clear(); await adapter.clear(s); }
    for (const s of STORES) { const arr = obj.data[s] || []; if (arr.length) { arr.forEach((o) => cache[s].set(o.id, o)); await adapter.bulkPut(s, arr); } }
    notify('*');
  }
  return { init, all, get, map, save, saveMany, remove, removeMany, clearAll, exportAll, importAll, validateBackup, on: (fn) => listeners.add(fn), get kind() { return adapter ? adapter.kind : '—'; }, get persisted() { return persisted; } };
})();

/* ---------- Serviços de domínio com histórico ---------- */
const Services = (() => {
  /** Grava um ingrediente. Se o custo unitário mudar, regista histórico com impacto nas fichas. */
  async function saveIngredient(ing, { source = 'manual' } = {}) {
    const prev = ing.id ? Repo.get('ingredients', ing.id) : null;
    const settings = getSettings();
    ing.id = ing.id || U.uid();
    let entry = null;
    if (prev) {
      const oldC = Calc.ingredientUnitCost(prev, settings).cost;
      const newC = Calc.ingredientUnitCost(ing, settings).cost;
      if (U.ok(oldC) && U.ok(newC) && Math.abs(oldC - newC) > 1e-9) {
        const before = recipeCostsUsing(ing.id);
        entry = { id: U.uid(), ingredientId: ing.id, ingredientName: ing.name, date: U.nowISO(), oldUnitCost: oldC, newUnitCost: newC, diffPct: oldC > 0 ? ((newC - oldC) / oldC) * 100 : NaN, oldPrice: prev.price, newPrice: ing.price, unit: prev.purchaseUnit, source, demo: !!ing.demo, impacts: [] };
        await Repo.save('ingredients', ing);
        const after = recipeCostsUsing(ing.id);
        entry.impacts = Object.keys(after).map((rid) => ({ recipeId: rid, recipeName: after[rid].name, oldDose: before[rid] ? before[rid].dose : NaN, newDose: after[rid].dose }));
        if (!ing.priceUpdatedAt || ing.priceUpdatedAt === prev.priceUpdatedAt) ing.priceUpdatedAt = U.todayISO();
        await Repo.save('ingredients', ing);
        await Repo.save('priceHistory', entry);
        return { ing, entry };
      }
    } else if (!ing.priceUpdatedAt) ing.priceUpdatedAt = U.todayISO();
    if (!ing.createdAt) ing.createdAt = U.nowISO();
    await Repo.save('ingredients', ing);
    return { ing, entry };
  }
  function recipeCostsUsing(ingId) {
    const data = dataView();
    const ev = Calc.evaluator(data);
    const out = {};
    Calc.usages(data, 'ing', ingId).all.forEach((rid) => { const r = data.recipes.get(rid); const c = ev.cost(r); out[rid] = { name: r.name, dose: c.perDose.total }; });
    return out;
  }
  /** Grava ficha e guarda uma versão (snapshot) com o custo nesse momento. */
  async function saveRecipe(rec, note = '') {
    rec.updatedAt = U.nowISO();
    if (!rec.createdAt) rec.createdAt = rec.updatedAt;
    rec.version = (Number(rec.version) || 0) + 1;
    await Repo.save('recipes', rec);
    const data = dataView();
    const c = Calc.evaluator(data).cost(rec);
    const p = Calc.pricing(rec, c, data.settings);
    await Repo.save('recipeVersions', { id: U.uid(), recipeId: rec.id, version: rec.version, date: rec.updatedAt, note, snapshot: U.clone({ ...rec, photo: undefined }), costDose: c.perDose.total, materialsDose: c.perDose.materials, salePrice: rec.salePrice || null, recommended: p.recommended.gross, demo: !!rec.demo });
    return rec;
  }
  async function deleteRecipe(id) {
    const vers = Repo.all('recipeVersions').filter((v) => v.recipeId === id).map((v) => v.id);
    await Repo.removeMany('recipeVersions', vers);
    await Repo.remove('recipes', id);
  }
  return { saveIngredient, saveRecipe, deleteRecipe, recipeCostsUsing };
})();

    { id: 'demo-o-agua', type: 'agua', name: 'Água (demo)', monthly: 120, include: true, demo: true },
    { id: 'demo-o-limp', type: 'limpeza', name: 'Produtos de limpeza (demo)', monthly: 180, include: true, demo: true },
    { id: 'demo-o-cons', type: 'consumiveis', name: 'Consumíveis — guardanapos, película, papel (demo)', monthly: 150, include: true, demo: true },
    { id: 'demo-o-elet', type: 'eletricidade', name: 'Eletricidade não associada a equipamentos — frio, iluminação (demo)', monthly: 450, include: true, demo: true },
  ];

  async function load() {
    await Repo.saveMany('ingredients', ingredients());
    await Repo.saveMany('staff', staff());
    await Repo.saveMany('equipment', equipment());
    await Repo.saveMany('opcosts', opcosts());
    for (const r of recipes()) if (!Repo.get('recipes', r.id)) await Services.saveRecipe(r, 'Dados de demonstração');
    await saveSettings({ demoLoaded: true });
  }
  /** Elimina dados demo. Mantém (e devolve) os que estão a ser usados por registos reais. */
  async function remove() {
    const data = dataView();
    const real = [...data.recipes.values()].filter((r) => !r.demo);
    const usedIng = new Set(), usedRec = new Set(), usedStaff = new Set(), usedEq = new Set();
    const markRec = (id) => { if (usedRec.has(id)) return; const r = data.recipes.get(id); if (!r || !r.demo) return; usedRec.add(id); scan(r); };
    const scan = (r) => {
      (r.lines || []).forEach((l) => { if (l.kind === 'ing' && String(l.refId).startsWith('demo-')) usedIng.add(l.refId); if (l.kind === 'rec') markRec(l.refId); });
      ((r.labor && r.labor.lines) || []).forEach((l) => String(l.staffId).startsWith('demo-') && usedStaff.add(l.staffId));
      (r.equipment || []).forEach((e) => String(e.equipId).startsWith('demo-') && usedEq.add(e.equipId));
    };
    real.forEach(scan);
    const del = (store, keep) => Repo.all(store).filter((o) => o.demo && !keep.has(o.id)).map((o) => o.id);
    const recDel = del('recipes', usedRec);
    for (const id of recDel) await Services.deleteRecipe(id);
    await Repo.removeMany('ingredients', del('ingredients', usedIng));
    await Repo.removeMany('staff', del('staff', usedStaff));
    await Repo.removeMany('equipment', del('equipment', usedEq));
    await Repo.removeMany('opcosts', del('opcosts', new Set()));
    await Repo.removeMany('priceHistory', Repo.all('priceHistory').filter((h) => h.demo && !usedIng.has(h.ingredientId)).map((h) => h.id));
    await saveSettings({ demoLoaded: false });
    return { kept: usedIng.size + usedRec.size + usedStaff.size + usedEq.size, keptNames: [...usedIng].map((id) => data.ingredients.get(id)?.name).concat([...usedRec].map((id) => data.recipes.get(id)?.name)).filter(Boolean) };
  }
  const has = () => ['ingredients', 'recipes', 'staff', 'equipment', 'opcosts'].some((s) => Repo.all(s).some((o) => o.demo));
  return { load, remove, has };
})();

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => el.remove(), type === 'err' ? 6000 : 3200);
}
function modal({ title, body, footer = '', size = '', onMount }) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true"><div class="modal-h"><h2>${h(title)}</h2><button class="btn icon" data-close aria-label="Fechar">✕</button></div><div class="modal-b">${body}</div>${footer ? `<div class="modal-f">${footer}</div>` : ''}</div>`;
  $('#modal-root').appendChild(bg);
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('mousedown', (e) => { if (e.target === bg) bg._down = true; });
  bg.addEventListener('mouseup', (e) => { if (e.target === bg && bg._down) close(); bg._down = false; });
  $$('[data-close]', bg).forEach((b) => b.addEventListener('click', close));
  const m = { el: bg, close, $: (s) => $(s, bg), $$: (s) => $$(s, bg) };
  if (onMount) onMount(m);
  const first = $('input:not([type=checkbox]),select,textarea', bg); if (first) setTimeout(() => first.focus(), 30);
  return m;
}
function confirmDlg(message, { title = 'Confirmar', ok = 'Confirmar', danger = false } = {}) {
  return new Promise((resolve) => {
    let done = false;
    const m = modal({ title, size: 'small', body: `<div>${message}</div>`, footer: `<button class="btn" data-close>Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${h(ok)}</button>` });
    m.$('[data-ok]').addEventListener('click', () => { done = true; m.close(); resolve(true); });
    const obs = new MutationObserver(() => { if (!document.body.contains(m.el)) { obs.disconnect(); if (!done) resolve(false); } });
    obs.observe($('#modal-root'), { childList: true });
  });
}

/** Preço unitário de uma linha: para g/ml/cl mostra por kg/L (mais legível). */
function fmtUnitPrice(up, unit) {
  if (!U.ok(up)) return '—';
  if (unit === 'g') return U.eur4(up * 1000) + '/kg';
  if (unit === 'ml') return U.eur4(up * 1000) + '/L';
  if (unit === 'cl') return U.eur4(up * 100) + '/L';
  return U.eur4(up) + '/' + (unit === 'dose' ? 'dose' : unit === 'emb' ? 'emb' : UNITS[unit] ? UNITS[unit].label : unit);
}
const signEur = (d) => (U.ok(d) ? (d > 0 ? '+' : '') + U.eur(d) : '—');

/** Lê valores de um formulário. Campos com class "num" são convertidos para número. */
function readForm(root) {
  const o = {};
  $$('[name]', root).forEach((el) => {
    if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; return; }
    if (el.type === 'checkbox') { o[el.name] = el.checked; return; }
    if (el.classList.contains('num')) { const t = el.value.trim(); o[el.name] = t === '' ? null : U.parseNum(t); return; }
    o[el.name] = el.value;
  });
  return o;
}

/* ---------- Gráficos SVG simples ---------- */
function barChart(items, { target, unit = '%', max, height } = {}) {
  if (!items.length) return '<div class="empty">Sem dados para o gráfico.</div>';
  const W = 640, rowH = 26, padL = 190, padR = 60, H = height || items.length * rowH + 30;
  const mx = max || Math.max(target || 0, ...items.map((i) => i.value)) * 1.1 || 1;
  const x = (v) => padL + (Math.max(0, v) / mx) * (W - padL - padR);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  items.forEach((it, i) => {
    const y = 10 + i * rowH;
    const col = it.color || (target && it.value > target ? 'var(--red)' : 'var(--green)');
    s += `<text x="${padL - 8}" y="${y + 15}" text-anchor="end" font-size="12" fill="#334">${h(it.label.length > 28 ? it.label.slice(0, 27) + '…' : it.label)}</text>`;
    s += `<rect x="${padL}" y="${y + 3}" width="${Math.max(1, x(it.value) - padL)}" height="16" rx="3" fill="${col}"/>`;
    s += `<text x="${x(it.value) + 5}" y="${y + 15}" font-size="11.5" fill="#334">${unit === '€' ? U.eur(it.value) : U.num(it.value, 1) + ' %'}</text>`;
  });
  if (target) { const tx = x(target); s += `<line x1="${tx}" x2="${tx}" y1="4" y2="${H - 14}" stroke="var(--navy)" stroke-dasharray="4 3"/><text x="${tx}" y="${H - 2}" font-size="11" text-anchor="middle" fill="var(--navy)">Objetivo ${U.num(target, 0)} %</text>`; }
  return s + '</svg>';
}
function donut(parts, { size = 180, label = '' } = {}) {
  const total = U.sum(parts, (p) => p.value);
  if (!(total > 0)) return '<div class="empty">Sem dados.</div>';
  const r = 70, c = 2 * Math.PI * r; let off = 0;
  let s = `<svg viewBox="0 0 ${size + 220} ${size}" class="chart" style="max-width:420px"><g transform="translate(${size / 2},${size / 2}) rotate(-90)">`;
  parts.forEach((p) => { const len = (p.value / total) * c; s += `<circle r="${r}" fill="none" stroke="${p.color}" stroke-width="26" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}"/>`; off += len; });
  s += `</g><text x="${size / 2}" y="${size / 2 - 2}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--navy)">${h(label)}</text><text x="${size / 2}" y="${size / 2 + 15}" text-anchor="middle" font-size="10.5" fill="#677">por dose</text>`;
  parts.forEach((p, i) => { const y = 28 + i * 26; s += `<rect x="${size + 14}" y="${y - 10}" width="12" height="12" rx="2" fill="${p.color}"/><text x="${size + 32}" y="${y}" font-size="12" fill="#334">${h(p.label)}: ${U.eur(p.value)} (${U.num((p.value / total) * 100, 0)} %)</text>`; });
  return s + '</svg>';
}
function lineChart(points, { height = 160 } = {}) {
  if (points.length < 2) return '<div class="muted small">Histórico insuficiente para gráfico (mínimo 2 registos).</div>';
  const W = 600, H = height, p = 34;
  const xs = points.map((q) => new Date(q.date).getTime()), ys = points.map((q) => q.value);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys) * 0.95, y1 = Math.max(...ys) * 1.05;
  const X = (v) => p + ((v - x0) / (x1 - x0 || 1)) * (W - 2 * p), Y = (v) => H - p + 10 - ((v - y0) / (y1 - y0 || 1)) * (H - 2 * p);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--green)" stroke-width="2.5" points="${points.map((q, i) => X(xs[i]) + ',' + Y(ys[i])).join(' ')}"/>`;
  points.forEach((q, i) => { s += `<circle cx="${X(xs[i])}" cy="${Y(ys[i])}" r="4" fill="var(--navy)"/><text x="${X(xs[i])}" y="${Y(ys[i]) - 8}" font-size="10.5" text-anchor="middle">${U.eur(ys[i])}</text><text x="${X(xs[i])}" y="${H - 6}" font-size="10" text-anchor="middle" fill="#677">${U.fmtDate(q.date)}</text>`; });
  return s + '</svg>';
}

function computeAll(ctx) {

  return [...data.recipes.values()].map((r) => {
    const c = ev.cost(r);
    const p = Calc.pricing(r, c, data.settings, ctx);
    return { r, c, p, s: Calc.status(r, c, p, data.settings) };
  });
}

    ${!st.lastBackup || U.daysSince(st.lastBackup) > 14 ? `<div class="alert warn">Os dados estão guardados apenas neste navegador. ${st.lastBackup ? 'A última cópia de segurança foi há ' + U.daysSince(st.lastBackup) + ' dias.' : 'Ainda não exportou nenhuma cópia de segurança.'} <button class="btn sm" id="dashBackup">Exportar agora</button></div>` : ''}

/* ------------------------------ 2. INGREDIENTES ------------------------------ */
const IngUI = {
  state: { q: '', cat: '', sup: '', stale: false, origin: '', sort: 'name', dir: 1, limit: 200 },
  baseLabel(ing) { const b = Calc.ingredientBase(ing); return b ? BASE_LABEL[b.dim] : '?'; },
  purchaseText(i) { return i.purchaseUnit === 'emb' ? `${U.numMax(i.purchaseQty)} emb. × ${U.numMax(i.packQty)} ${UNITS[i.packUnit] ? UNITS[i.packUnit].label : '?'}` : `${U.numMax(i.purchaseQty)} ${UNITS[i.purchaseUnit] ? UNITS[i.purchaseUnit].label : i.purchaseUnit}`; },
};
Views.ingredientes = (el) => {
  const st = getSettings();
  if (location.hash.includes('?stale')) IngUI.state.stale = true;
  const S = IngUI.state;
  const ings = Repo.all('ingredients');
  const cats = [...new Set([...st.ingredientCategories, ...ings.map((i) => i.category).filter(Boolean)])].sort();
  const sups = [...new Set(ings.map((i) => i.supplier).filter(Boolean))].sort();
  el.innerHTML = `<div class="card">
    <div class="toolbar">
      <input class="search" id="iq" placeholder="Pesquisar por nome, código ou fornecedor…" value="${h(S.q)}">
      <select id="icat">${options(cats, S.cat, { empty: 'Todas as categorias' })}</select>
      <select id="isup">${options(sups, S.sup, { empty: 'Todos os fornecedores' })}</select>
      <select id="iorig">${options([['real', 'Só dados reais'], ['demo', 'Só demonstração']], S.origin, { empty: 'Todos os registos' })}</select>
      <label class="check"><input type="checkbox" id="istale" ${S.stale ? 'checked' : ''}> Desatualizados</label>
      <span class="grow"></span>
      <button class="btn" id="iexp">⤓ Excel</button>
      <a class="btn" href="#/importacao">Importar</a>
      <button class="btn primary" id="inew">+ Novo ingrediente</button>
    </div>
    <div class="help">Edite o preço diretamente na tabela: as fichas técnicas que usam o ingrediente são recalculadas automaticamente e a alteração fica no histórico.</div>
    <div id="itable"></div></div>`;
  const draw = () => {
    const q = U.normalize(S.q);
    let list = ings.filter((i) => (!q || U.normalize(`${i.name} ${i.code} ${i.supplier}`).includes(q)) && (!S.cat || i.category === S.cat) && (!S.sup || i.supplier === S.sup) && (!S.stale || U.daysSince(i.priceUpdatedAt) > st.staleDays) && (!S.origin || (S.origin === 'demo' ? i.demo : !i.demo)));
    const uc = new Map(list.map((i) => [i.id, Calc.ingredientUnitCost(i, st)]));
    const key = { name: (i) => U.normalize(i.name), code: (i) => i.code || '', cat: (i) => i.category || '', unit: (i) => uc.get(i.id).cost || 0, date: (i) => i.priceUpdatedAt || '', waste: (i) => Number(i.wastePct) || 0 }[S.sort];
    list.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * S.dir);
    const shown = list.slice(0, S.limit);
    const th = (k, l, cls = '') => `<th class="sortable ${cls}" data-sort="${k}">${l}${S.sort === k ? (S.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
    $('#itable', el).innerHTML = list.length ? `<div class="table-wrap"><table><thead><tr>${th('code', 'Código')}${th('name', 'Ingrediente')}${th('cat', 'Categoria')}<th>Fornecedor</th><th>Compra</th><th class="r">Preço compra</th><th class="r">IVA</th>${th('unit', 'Custo/base', 'r')}${th('waste', 'Desp.', 'r')}<th class="r">Rend.</th><th>Alergénios</th>${th('date', 'Atualizado')}<th></th></tr></thead><tbody>
      ${shown.map((i) => { const c = uc.get(i.id); const old = U.daysSince(i.priceUpdatedAt) > st.staleDays; return `<tr data-id="${i.id}">
        <td class="small">${h(i.code || '')}</td><td><b>${h(i.name)}</b>${demoTag(i)}</td><td class="small">${h(i.category || '—')}</td><td class="small">${h(i.supplier || '—')}</td>
        <td class="small nowrap">${h(IngUI.purchaseText(i))}</td>
        <td class="r"><input class="num inline-edit" data-price value="${h(vNum(i.price))}" title="Preço ${i.priceIncludesVat ? 'com' : 'sem'} IVA"> <span class="small muted">${i.priceIncludesVat ? 'c/IVA' : 's/IVA'}</span></td>
        <td class="r small">${U.num(Number(i.vat) || 0, 0)} %</td>
        <td class="r nowrap ${c.error ? 'red' : ''}">${c.error ? h(c.error) : U.eur4(c.cost) + '/' + h(IngUI.baseLabel(i))}</td>
        <td class="r small">${U.num(Number(i.wastePct) || 0, 1)} %</td><td class="r small">${U.num(100 - (Number(i.wastePct) || 0), 1)} %</td>
        <td>${algList(i.allergens || [], i.traces || [])}</td>
        <td class="small nowrap ${old ? 'red' : ''}">${U.fmtDate(i.priceUpdatedAt)}</td>
        <td class="nowrap"><button class="btn sm" data-act="edit">Editar</button> <button class="btn sm" data-act="hist" title="Histórico de preços">Histórico</button> <button class="btn sm" data-act="use" title="Fichas que usam este ingrediente">Uso</button> <button class="btn sm danger" data-act="del" title="Eliminar">✕</button></td></tr>`; }).join('')}
      </tbody></table></div>${list.length > S.limit ? `<div class="empty"><button class="btn" id="imore">Mostrar mais (${list.length - S.limit} restantes)</button></div>` : ''}<div class="small muted" style="margin-top:6px">${list.length} de ${ings.length} ingredientes</div>`
      : `<div class="empty">${ings.length ? 'Nenhum ingrediente corresponde aos filtros.' : 'Ainda não há ingredientes. Crie um novo ou importe uma lista.'}</div>`;
    $$('[data-sort]', el).forEach((t) => (t.onclick = () => { S.dir = S.sort === t.dataset.sort ? -S.dir : 1; S.sort = t.dataset.sort; draw(); }));
    const more = $('#imore', el); if (more) more.onclick = () => { S.limit += 200; draw(); };
    $$('tr[data-id]', el).forEach((tr) => {
      const ing = Repo.get('ingredients', tr.dataset.id);
      $('[data-price]', tr).addEventListener('change', async (e) => {
        const v = U.parseNum(e.target.value);
        if (!(v >= 0)) { e.target.classList.add('bad'); toast('Preço inválido', 'err'); return; }
        e.target.classList.remove('bad');
        if (Math.abs(v - Number(ing.price)) < 1e-9) return;
        const res = await Services.saveIngredient({ ...ing, price: v, priceUpdatedAt: U.todayISO() }, { source: 'tabela' });
        toast(res.entry ? `Preço atualizado (${signPct(res.entry.diffPct)}). ${res.entry.impacts.length} ficha(s) recalculada(s).` : 'Preço atualizado', 'ok');
        draw();
      });
      $$('[data-act]', tr).forEach((b) => (b.onclick = () => ({ edit: () => ingredientForm(ing, draw), hist: () => ingredientHistory(ing), use: () => ingredientUsage(ing), del: () => deleteIngredient(ing, draw) })[b.dataset.act]()));
    });
  };
  const refresh = () => Views.ingredientes(el);
  $('#iq', el).oninput = (e) => { S.q = e.target.value; S.limit = 200; draw(); };
  $('#icat', el).onchange = (e) => { S.cat = e.target.value; draw(); };
  $('#isup', el).onchange = (e) => { S.sup = e.target.value; draw(); };
  $('#iorig', el).onchange = (e) => { S.origin = e.target.value; draw(); };
  $('#istale', el).onchange = (e) => { S.stale = e.target.checked; draw(); };
  $('#inew', el).onclick = () => ingredientForm(null, refresh);
  $('#iexp', el).onclick = () => exportRows('xlsx', 'ingredientes', [Reports.ingredientsSheet()]);
  draw();
};

function ingredientForm(ing, after) {
  const st = getSettings();
  const isNew = !ing;
  const i = ing ? U.clone(ing) : { purchaseUnit: 'kg', purchaseQty: 1, price: null, vat: 6, priceIncludesVat: false, wastePct: 0, allergens: [], traces: [], priceUpdatedAt: U.todayISO() };
  const ings = Repo.all('ingredients');
  const cats = [...new Set([...st.ingredientCategories, ...ings.map((x) => x.category).filter(Boolean)])].sort();
  const sups = [...new Set(ings.map((x) => x.supplier).filter(Boolean))].sort();
  const algChecks = (name, sel) => `<div class="grid g2" style="gap:4px">${ALLERGENS.map((a) => `<label class="check"><input type="checkbox" name="${name}_${a.id}" ${(sel || []).includes(a.id) ? 'checked' : ''}> ${algBadge(a.id)} ${h(a.name)}</label>`).join('')}</div>`;
  const m = modal({
    title: isNew ? 'Novo ingrediente' : 'Editar ingrediente', size: 'wide',
    body: `<form id="ingf" autocomplete="off">
      ${i.demo ? '<div class="alert info">Registo de demonstração (preço fictício).</div>' : ''}
      <div class="fields">
        <div class="field"><label>Código interno</label><input name="code" value="${h(i.code || '')}"></div>
        <div class="field" style="grid-column:span 2"><label>Nome do ingrediente *</label><input name="name" value="${h(i.name || '')}" required></div>
        <div class="field"><label>Categoria</label><input name="category" list="dl-cat" value="${h(i.category || '')}"><datalist id="dl-cat">${cats.map((c) => `<option value="${h(c)}">`).join('')}</datalist></div>
        <div class="field"><label>Fornecedor</label><input name="supplier" list="dl-sup" value="${h(i.supplier || '')}"><datalist id="dl-sup">${sups.map((c) => `<option value="${h(c)}">`).join('')}</datalist></div>
      </div>
      <div class="sep"></div><h4>Compra e preço</h4>
      <div class="fields">
        <div class="field"><label>Unidade de compra *</label><select name="purchaseUnit">${options(PURCHASE_UNITS, i.purchaseUnit)}</select></div>
        <div class="field"><label>Quantidade comprada *</label>${numInput('purchaseQty', i.purchaseQty)}</div>
        <div class="field emb"><label>Conteúdo de cada embalagem *</label>${numInput('packQty', i.packQty)}</div>
        <div class="field emb"><label>Unidade do conteúdo</label><select name="packUnit">${options(Object.keys(UNITS).map((u) => [u, UNITS[u].label]), i.packUnit || 'kg')}</select></div>
        <div class="field"><label>Preço de compra (total) *</label>${numInput('price', i.price)}<span class="hint">Valor pago pela quantidade indicada</span></div>
        <div class="field"><label>IVA da compra (%)</label>${numInput('vat', i.vat, 'list="dl-vat"')}<datalist id="dl-vat"><option value="6"><option value="13"><option value="23"><option value="0"></datalist></div>
        <div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" name="priceIncludesVat" ${i.priceIncludesVat ? 'checked' : ''}> O preço inclui IVA</label></div>
        <div class="field"><label>Data da última atualização</label><input type="date" name="priceUpdatedAt" value="${h(i.priceUpdatedAt || '')}"></div>
      </div>
      <div class="alert ok" id="ucalc" style="margin-top:10px"></div>
      <div class="sep"></div><h4>Aproveitamento e conversões</h4>
      <div class="fields">
        <div class="field"><label>Desperdício (%)</label>${numInput('wastePct', i.wastePct)}<span class="hint">Perda na limpeza/preparação</span></div>
        <div class="field"><label>Rendimento aproveitável (%)</label>${numInput('yieldPct', 100 - (Number(i.wastePct) || 0))}</div>
        <div class="field"><label>Densidade (kg/L) — opcional</label>${numInput('density', i.density)}<span class="hint">Para converter peso ↔ volume</span></div>
        <div class="field"><label>Peso por unidade (g) — opcional</label>${numInput('unitWeightG', i.unitWeightG)}<span class="hint">Para converter unidades ↔ peso</span></div>
      </div>
      <div class="sep"></div>
      <div class="grid g2">
        <div><h4>Alergénios — contém</h4>${algChecks('a', i.allergens)}</div>
        <div><h4>Pode conter (contaminação cruzada)</h4>${algChecks('t', i.traces)}</div>
      </div>
      <div class="sep"></div>
      <div class="field"><label>Observações</label><textarea name="notes">${h(i.notes || '')}</textarea></div>
    </form>`,
    footer: `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="ingSave">Guardar</button>`,
  });
  const f = m.$('#ingf');
  const upd = () => {
    const v = readForm(f);
    $$('.emb', f).forEach((x) => (x.style.display = v.purchaseUnit === 'emb' ? '' : 'none'));
    const tmp = { ...i, ...v };
    const c = Calc.ingredientUnitCost(tmp, st);
    const b = Calc.ingredientBase(tmp);
    m.$('#ucalc').innerHTML = c.error || !b ? `<span class="red">${h(c.error || 'Indique quantidade e unidade')}</span>` :
      `Preço por ${BASE_LABEL[b.dim]}: <b>${U.eur4(c.net)}</b> sem IVA · ${U.eur4(c.gross)} com IVA · custo usado nas fichas: <b>${U.eur4(c.cost)}</b> ${st.vatDeductible ? '(IVA dedutível)' : '(IVA não dedutível)'}${Number(v.wastePct) > 0 && Number(v.wastePct) < 100 ? ` · custo efetivo com desperdício: <b>${U.eur4(c.cost / (1 - v.wastePct / 100))}</b>` : ''}`;
  };
  f.addEventListener('input', (e) => {
    if (e.target.name === 'wastePct') { const w = U.parseNum(e.target.value); if (U.ok(w)) $('[name=yieldPct]', f).value = U.inNum(100 - w); }
    if (e.target.name === 'yieldPct') { const y = U.parseNum(e.target.value); if (U.ok(y)) $('[name=wastePct]', f).value = U.inNum(100 - y); }
    upd();
  });
  f.addEventListener('change', upd);
  upd();
  m.$('#ingSave').onclick = async () => {
    const v = readForm(f);
    const bad = [];
    if (!String(v.name || '').trim()) bad.push('name');
    if (!(v.purchaseQty > 0)) bad.push('purchaseQty');
    if (v.price === null || !(v.price >= 0)) bad.push('price');
    if (v.vat !== null && !(v.vat >= 0 && v.vat <= 100)) bad.push('vat');
    if (v.wastePct !== null && !(v.wastePct >= 0 && v.wastePct < 100)) bad.push('wastePct');
    if (v.purchaseUnit === 'emb' && !(v.packQty > 0)) bad.push('packQty');
    if (v.density !== null && !(v.density > 0)) bad.push('density');
    if (v.unitWeightG !== null && !(v.unitWeightG > 0)) bad.push('unitWeightG');
    markInvalid(f, bad);
    if (bad.length) { toast('Corrija os campos assinalados', 'err'); return; }
    const out = { ...i, code: v.code.trim(), name: v.name.trim(), category: v.category.trim(), supplier: v.supplier.trim(), purchaseUnit: v.purchaseUnit, purchaseQty: v.purchaseQty, packQty: v.purchaseUnit === 'emb' ? v.packQty : null, packUnit: v.purchaseUnit === 'emb' ? v.packUnit : null, price: v.price, vat: v.vat || 0, priceIncludesVat: v.priceIncludesVat, wastePct: v.wastePct || 0, density: v.density, unitWeightG: v.unitWeightG, priceUpdatedAt: v.priceUpdatedAt || U.todayISO(), notes: v.notes, allergens: ALLERGENS.filter((a) => v['a_' + a.id]).map((a) => a.id), traces: ALLERGENS.filter((a) => v['t_' + a.id] && !v['a_' + a.id]).map((a) => a.id) };
    delete out.yieldPct;
    const dup = ings.find((x) => x.id !== out.id && ((out.code && x.code && U.normalize(x.code) === U.normalize(out.code)) || U.normalize(x.name) === U.normalize(out.name)));
    if (dup && !(await confirmDlg(`Já existe um ingrediente semelhante: <b>${h(dup.name)}</b>${dup.code ? ' (código ' + h(dup.code) + ')' : ''}. Guardar mesmo assim?`, { ok: 'Guardar duplicado' }))) return;
    const priceChanged = ing && (ing.price !== out.price || ing.purchaseQty !== out.purchaseQty || ing.packQty !== out.packQty || ing.vat !== out.vat || ing.priceIncludesVat !== out.priceIncludesVat || ing.purchaseUnit !== out.purchaseUnit);
    if (priceChanged && out.priceUpdatedAt === ing.priceUpdatedAt) out.priceUpdatedAt = U.todayISO();
    const res = await Services.saveIngredient(out);
    m.close();
    toast(res.entry ? `Guardado. Custo ${signPct(res.entry.diffPct)}; ${res.entry.impacts.length} ficha(s) recalculada(s).` : 'Ingrediente guardado', 'ok');
    after && after();
  };
}
function ingredientHistory(ing) {
  const hist = Repo.all('priceHistory').filter((x) => x.ingredientId === ing.id).sort((a, b) => a.date.localeCompare(b.date));
  const pts = hist.length ? [{ date: ing.createdAt || hist[0].date, value: hist[0].oldUnitCost }, ...hist.map((x) => ({ date: x.date, value: x.newUnitCost }))] : [];
  if (pts.length > 1 && new Date(pts[0].date) >= new Date(pts[1].date)) pts[0].date = new Date(new Date(pts[1].date).getTime() - 86400000).toISOString();
  const bl = IngUI.baseLabel(ing);
  modal({ title: 'Histórico de preços — ' + ing.name, size: 'wide', body: `
    ${lineChart(pts)}
    ${hist.length ? `<div class="table-wrap"><table><thead><tr><th>Data</th><th class="r">Custo anterior</th><th class="r">Custo novo</th><th class="r">Diferença</th><th>Origem</th><th>Impacto nas fichas (custo por dose)</th></tr></thead><tbody>${hist.slice().reverse().map((x) => `<tr><td class="nowrap">${U.fmtDateTime(x.date)}</td><td class="r">${U.eur4(x.oldUnitCost)}/${h(bl)}</td><td class="r">${U.eur4(x.newUnitCost)}/${h(bl)}</td><td class="r ${diffCls(x.diffPct)}">${signPct(x.diffPct)}</td><td class="small">${h(x.source || '')}</td><td class="small">${x.impacts.length ? x.impacts.map((im) => `${h(im.recipeName)}: ${U.eur(im.oldDose)} → <b>${U.eur(im.newDose)}</b> <span class="${diffCls(im.newDose - im.oldDose)}">(${signEur(im.newDose - im.oldDose)})</span>`).join('<br>') : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Sem alterações de preço registadas.</div>'}` });
}
function ingredientUsage(ing) {
  const data = dataView();
  const u = Calc.usages(data, 'ing', ing.id);
  const ev = Calc.evaluator(data);
  modal({ title: 'Fichas que usam — ' + ing.name, body: u.all.length ? `<div class="table-wrap"><table><thead><tr><th>Ficha técnica</th><th>Utilização</th><th class="r">Custo/dose</th></tr></thead><tbody>${u.all.map((id) => { const r = data.recipes.get(id); return `<tr><td><a href="#/ficha/${id}" data-close>${h(r.name)}</a></td><td>${u.direct.includes(id) ? 'Direta' : 'Via preparação intermédia'}</td><td class="r">${U.eur(ev.cost(r).perDose.total)}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">Este ingrediente não é usado em nenhuma ficha.</div>' });
}
async function deleteIngredient(ing, after) {
  const u = Calc.usages(dataView(), 'ing', ing.id);
  if (u.direct.length) { modal({ title: 'Não é possível eliminar', size: 'small', body: `<p><b>${h(ing.name)}</b> é usado em ${u.direct.length} ficha(s): ${u.direct.map((id) => h(Repo.get('recipes', id).name)).join(', ')}.</p><p>Remova-o dessas fichas primeiro.</p>` }); return; }
  if (!(await confirmDlg(`Eliminar <b>${h(ing.name)}</b>? O histórico de preços também será eliminado.`, { ok: 'Eliminar', danger: true }))) return;
  await Repo.removeMany('priceHistory', Repo.all('priceHistory').filter((x) => x.ingredientId === ing.id).map((x) => x.id));
  await Repo.remove('ingredients', ing.id);
  toast('Ingrediente eliminado'); after && after();
}

function resizeImage(file, max) {

    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); resolve(cv.toDataURL('image/jpeg', 0.82)); };

function compareVersion(v) {
  const data = dataView();

  const ev = Calc.evaluator(data);

  const oldNowPrices = Calc.evaluator(dataView({ recipe: { ...v.snapshot } })).cost(v.snapshot);
  const name = (l) => (l.kind === 'rec' ? (data.recipes.get(l.refId) || {}).name : (data.ingredients.get(l.refId) || {}).name) || '(removido)';
  const key = (l) => l.kind + ':' + l.refId;
  const oldMap = new Map(v.snapshot.lines.map((l) => [key(l), l])), newMap = new Map(cur.lines.map((l) => [key(l), l]));
  const keys = [...new Set([...oldMap.keys(), ...newMap.keys()])];

    <div class="grid g3"><div class="kpi"><div class="l">Custo/dose em ${U.fmtDate(v.date)}</div><div class="v">${U.eur(v.costDose)}</div><div class="s">receita e preços dessa data</div></div>

    <h3 style="margin-top:14px">Ingredientes</h3><div class="table-wrap"><table><thead><tr><th>Ingrediente</th><th class="r">v${v.version}</th><th class="r">Atual</th><th>Alteração</th></tr></thead><tbody>
    ${keys.map((k) => { const o = oldMap.get(k), n = newMap.get(k); const ch = !o ? '<span class="badge green">Adicionado</span>' : !n ? '<span class="badge red">Removido</span>' : (o.qty !== n.qty || o.unit !== n.unit || o.wastePct !== n.wastePct) ? '<span class="badge amber">Alterado</span>' : ''; return `<tr><td>${h(name(o || n))}</td><td class="r">${fmtQ(o)}</td><td class="r">${fmtQ(n)}</td><td>${ch}</td></tr>`; }).join('')}

  $$('[data-ql]', el).forEach((i) => i.addEventListener('input', () => { const v = U.parseNum(i.value); const id = i.dataset.ql; Sim.qty = Sim.qty.filter((q) => q.lineId !== id); if (U.ok(v) && v > -100) Sim.qty.push({ lineId: id, pct: v }); draw(); }));
  $('#simReset', el).onclick = () => { Object.assign(Sim, { scope: '', adj: [], elec: 0, gas: 0, labor: 0, priceDelta: 0, targetFC: '', qty: [] }); Views.simulador(el); };
  draw();
};

Views.configuracoes = (el) => {
  const st = getSettings();
  el.innerHTML = `<div class="grid g2">

      <div class="field" style="grid-column:1/-1"><label>Nome do estabelecimento (aparece nos relatórios)</label><input name="businessName" value="${h(st.businessName)}"></div>
      <div class="field"><label>Food Cost pretendido padrão (%)</label>${numInput('targetFC', st.targetFC)}</div>
      <div class="field"><label>Diferença entre sugestões (pontos %)</label>${numInput('tierDelta', st.tierDelta)}<span class="hint">Económico = alvo + x; Premium = alvo − x</span></div>
      <div class="field" style="grid-column:1/-1"><label>Base de cálculo do preço sugerido</label><select name="fcBase">${options([['materias', 'Custo das matérias-primas ÷ Food Cost (definição clássica)'], ['total', 'Custo total de produção ÷ percentagem pretendida']], st.fcBase)}</select>
        <span class="hint">Com "custo total", a mão de obra e os indiretos entram no numerador e a percentagem deixa de ser um Food Cost em sentido estrito (fica mais próxima do "prime cost"). Os preços sugeridos sobem bastante.</span></div>
      <div class="field"><label>IVA de venda padrão (%)</label>${numInput('defaultSaleVat', st.defaultSaleVat)}</div>
      <div class="field"><label>Preço desatualizado após (dias)</label>${numInput('staleDays', st.staleDays)}</div>
      <div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" name="vatDeductible" ${st.vatDeductible ? 'checked' : ''}> IVA das compras é dedutível</label><span class="hint">Se sim, o custo usa o preço sem IVA</span></div>
      <div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" name="roundingEnabled" ${st.roundingEnabled ? 'checked' : ''}> Arredondamento comercial</label></div>
      <div class="field" style="grid-column:span 2"><label>Terminações de preço (separadas por ;)</label><input name="roundingEndings" value="${h(st.roundingEndings)}"><span class="hint">ex.: 0,50; 0,90 → 9,90 · 10,50 · 12,90 · 14,90</span></div>
    </div><button type="button" class="btn primary" id="cfgSave" style="margin-top:12px">Guardar configurações</button></form></div>
    <div class="card"><div class="card-h"><h3>Categorias de venda e taxas de IVA</h3><button class="btn sm" id="vcAdd">+ Categoria</button></div>
      <div class="table-wrap"><table><thead><tr><th>Categoria</th><th class="r">IVA (%)</th><th></th></tr></thead><tbody>${st.saleCategories.map((c, i) => `<tr data-vc="${i}"><td><input data-vf="name" value="${h(c.name)}" style="width:100%"></td><td class="r"><input class="num" data-vf="vat" value="${h(U.inNum(c.vat))}" style="width:70px"></td><td><button class="btn sm danger" data-vdel>✕</button></td></tr>`).join('')}</tbody></table></div>
      <div class="help">Valores de exemplo. Confirme as taxas aplicáveis a cada produto com o seu contabilista (por exemplo, bebidas alcoólicas e refrigerantes têm normalmente taxa normal na restauração).</div>
      <div class="field" style="margin-top:10px"><label>Categorias de ingredientes (uma por linha)</label><textarea id="icats">${h(st.ingredientCategories.join('\n'))}</textarea></div>
      <button class="btn primary" id="catSave" style="margin-top:8px">Guardar categorias</button></div></div>
    <div class="grid g2">
    <div class="card"><div class="card-h"><h3>Cópias de segurança</h3></div>
      <p>Os dados ficam guardados neste navegador (${h(Repo.kind)}). Limpar os dados do navegador apaga-os: exporte cópias regularmente.${st.lastBackup ? ` Última exportação: ${U.fmtDateTime(st.lastBackup)}.` : ''}</p>
      <div class="toolbar"><button class="btn primary" id="bkExp">⤓ Exportar cópia (.json)</button><label class="btn">⤒ Importar cópia<input type="file" id="bkImp" accept=".json,application/json" hidden></label>
      <select id="bkMode"><option value="replace">Substituir todos os dados</option><option value="merge">Juntar aos dados atuais</option></select></div></div>
    <div class="card"><div class="card-h"><h3>Dados de demonstração</h3></div>
      <p>${Demo.has() ? 'Existem dados de demonstração carregados (assinalados com DEMO).' : 'Não há dados de demonstração.'}</p>
      <div class="toolbar"><button class="btn green" id="demoLoad">Carregar demonstração</button><button class="btn danger" id="demoDel" ${Demo.has() ? '' : 'disabled'}>Eliminar dados de demonstração</button></div>
      <div class="sep"></div><h4>Zona de perigo</h4><button class="btn danger" id="wipe">Apagar todos os dados</button></div></div>`;
  $('#cfgSave', el).onclick = async () => {
    const v = readForm($('#cfg', el)); const bad = [];
    if (!(v.targetFC > 0 && v.targetFC < 100)) bad.push('targetFC');
    if (!(v.tierDelta >= 0 && v.tierDelta < 50)) bad.push('tierDelta');
    if (!(v.defaultSaleVat >= 0 && v.defaultSaleVat <= 100)) bad.push('defaultSaleVat');
    if (!(v.staleDays > 0)) bad.push('staleDays');
    if (v.roundingEnabled && !Calc.parseEndings(v.roundingEndings).length) bad.push('roundingEndings');
    markInvalid($('#cfg', el), bad); if (bad.length) return toast('Corrija os campos assinalados', 'err');
    await saveSettings(v); toast('Configurações guardadas — preços recalculados', 'ok');
  };
  $('#vcAdd', el).onclick = async () => { await saveSettings({ saleCategories: [...st.saleCategories, { name: 'Nova categoria', vat: st.defaultSaleVat }] }); Views.configuracoes(el); };
  $$('tr[data-vc]', el).forEach((tr) => {
    const i = +tr.dataset.vc;
    $$('[data-vf]', tr).forEach((inp) => (inp.onchange = async () => {
      const cs = U.clone(st.saleCategories); const old = cs[i].name;
      if (inp.dataset.vf === 'vat') { const v = U.parseNum(inp.value); if (!(v >= 0 && v <= 100)) { inp.classList.add('bad'); return; } cs[i].vat = v; }
      else { const nv = inp.value.trim(); if (!nv) return; cs[i].name = nv; const affected = Repo.all('recipes').filter((r) => r.category === old); for (const r of affected) await Repo.save('recipes', { ...r, category: nv }); }
      await saveSettings({ saleCategories: cs }); toast('Guardado', 'ok'); Views.configuracoes(el);
    }));
    $('[data-vdel]', tr).onclick = async () => { const n = st.saleCategories[i].name; const used = Repo.all('recipes').filter((r) => r.category === n).length; if (used && !(await confirmDlg(`${used} ficha(s) usam "${h(n)}". Passarão a usar o IVA padrão. Continuar?`))) return; const cs = st.saleCategories.filter((_, j) => j !== i); await saveSettings({ saleCategories: cs }); Views.configuracoes(el); };
  });
  $('#catSave', el).onclick = async () => { const list = [...new Set($('#icats', el).value.split('\n').map((x) => x.trim()).filter(Boolean))]; await saveSettings({ ingredientCategories: list }); toast('Categorias guardadas', 'ok'); };
  $('#bkExp', el).onclick = () => { backupDownload(); Views.configuracoes(el); };
  $('#bkImp', el).onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const obj = JSON.parse(await f.text()); Repo.validateBackup(obj);
      const n = Object.values(obj.data).reduce((a, x) => a + x.length, 0);
      const mode = $('#bkMode', el).value;
      if (!(await confirmDlg(`Importar ${n} registos de ${U.fmtDateTime(obj.exportedAt)}? ${mode === 'replace' ? '<b>Todos os dados atuais serão substituídos.</b>' : 'Registos com o mesmo identificador serão substituídos.'}`, { ok: 'Importar', danger: mode === 'replace' }))) return;
      await Repo.importAll(obj, mode); toast('Cópia importada', 'ok'); route();
    } catch (err) { toast('Erro: ' + err.message, 'err'); }
  };
  $('#demoLoad', el).onclick = async () => { await Demo.load(); toast('Dados de demonstração carregados', 'ok'); Views.configuracoes(el); };
  $('#demoDel', el).onclick = async () => {
    if (!(await confirmDlg('Eliminar todos os dados de demonstração? Os seus dados reais não são afetados.', { ok: 'Eliminar', danger: true }))) return;
    const r = await Demo.remove();
    toast(r.kept ? `Demonstração eliminada. ${r.kept} registo(s) mantidos por estarem a ser usados em fichas reais: ${r.keptNames.join(', ')}` : 'Dados de demonstração eliminados', 'ok');
    Views.configuracoes(el);
  };
  $('#wipe', el).onclick = async () => {
    if (!(await confirmDlg('Apagar <b>todos</b> os dados (ingredientes, fichas, histórico, configurações)? Esta ação não pode ser desfeita. Exporte primeiro uma cópia de segurança.', { ok: 'Apagar tudo', danger: true }))) return;
    if (!(await confirmDlg('Tem a certeza absoluta?', { ok: 'Sim, apagar tudo', danger: true }))) return;
    await Repo.clearAll(); toast('Todos os dados foram apagados'); route();
  };
};

  const foot = () => `<div class="foot">Documento gerado pela aplicação de fichas técnicas. Valores de custo estimados com base nos dados introduzidos. Margens e lucros apresentados não correspondem ao lucro líquido do negócio.</div>`;
  const toHtmlTable = (rows) => { const [hd, ...body] = rows; const cell = (c) => { const v = c && typeof c === 'object' ? c : { v: c }; if (v.v === null || v.v === undefined || v.v === '') return ''; if (v.t === 'eur' || v.t === 'eurb') return U.eur(v.v); if (v.t === 'pct') return U.pct(v.v); if (v.t === 'num') return U.numMax(v.v, 3); return h(v.v); }; const al = (c) => (c && typeof c === 'object' && ['eur', 'pct', 'num', 'eurb'].includes(c.t) ? ' class="r"' : ''); return `<table><thead><tr>${hd.map((c) => `<th>${h(c && typeof c === 'object' ? c.v : c)}</th>`).join('')}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td${al(c)}>${cell(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`; };

  function recipeDoc(rec, opts = {}) {

      <div style="display:flex;gap:14px">${rec.photo ? `<img src="${rec.photo}" style="width:170px;height:128px;object-fit:cover;border-radius:6px">` : ''}
      <div class="meta" style="flex:1"><div><b>Doses:</b> ${U.numMax(rec.portions)}</div><div><b>Quantidade final:</b> ${rec.finalQty ? U.numMax(rec.finalQty) + ' ' + ul(rec.finalUnit) : '—'}</div><div><b>Preparação:</b> ${m.prep} min</div><div><b>Confeção:</b> ${m.cook} min</div>
      <div><b>Empratamento:</b> ${m.plat} min</div><div><b>Limpeza:</b> ${m.clean} min</div><div><b>Tempo total:</b> ${m.total} min</div><div><b>Temperatura:</b> ${h(rec.temperature || '—')}</div></div></div>
      <h2>Ingredientes</h2><table><thead><tr><th>Ingrediente</th><th>Qtd. líquida</th><th>Desp.</th><th>Qtd. bruta</th><th>Preço unit.</th><th>Custo efetivo</th><th>Alergénios</th></tr></thead><tbody>
      ${c.lines.map((L) => `<tr><td>${h(L.name)}${L.kind === 'rec' ? ' (preparação)' : ''}${L.error ? ' — <b style="color:#c00">' + h(L.error) + '</b>' : ''}</td><td>${U.numMax(L.qty)} ${ul(L.unit)}</td><td>${U.num(L.wastePct, 1)} %</td><td>${U.ok(L.grossQty) ? U.numMax(L.grossQty) + ' ' + ul(L.unit) : '—'}</td><td>${h(fmtUnitPrice(L.unitPrice, L.unit))}</td><td class="r">${U.eur(L.effCost)}</td><td>${algNames(L.allergens)}</td></tr>`).join('')}

      sheet: () => ({ name: 'Alergénios', widths: [34, ...ALLERGENS.map(() => 9), 12], rows: [['Ficha', ...ALLERGENS.map((a) => a.short), 'Confirmado'].map(H), ...computeAll().sort((a, b) => a.r.name.localeCompare(b.r.name, 'pt')).map((x) => [x.r.name, ...ALLERGENS.map((a) => (x.c.allergens.present.includes(a.id) ? 'Contém' : x.c.allergens.traces.includes(a.id) ? 'Pode conter' : '')), x.c.allergens.confirmed ? 'Sim' : 'Não'])] }),
      printHtml: () => allergenDoc(sellable().map((x) => x.r)) },
    precos: { title: 'Comparação de preços de venda', desc: 'Preço praticado vs. sugestões',
      sheet: () => ({ name: 'Preços', widths: [34, 14, 14, 14, 14, 14, 12, 12, 16], rows: [['Produto', 'Custo total/dose', 'Económico', 'Recomendado', 'Premium', 'Praticado', 'FC praticado', 'FC objetivo', 'Diferença p/ recom.'].map(H), ...sellable().map((x) => [x.r.name, E(x.c.perDose.total), E(x.p.tiers[0].gross), E(x.p.tiers[1].gross), E(x.p.tiers[2].gross), E(x.p.current ? x.p.current.gross : NaN), P(x.p.current ? x.p.current.foodCostPct : NaN), P(x.p.target), E(x.p.current ? x.p.current.gross - x.p.recommended.gross : NaN)])] }) },
    rentaveis: { title: 'Ranking dos pratos mais rentáveis', desc: 'Ordenado pelo lucro estimado por dose',
      sheet: () => ({ name: 'Mais rentáveis', widths: [6, 34, 14, 14, 14, 14, 12], rows: [['#', 'Produto', 'PV c/IVA', 'Margem contribuição', 'Lucro est./dose', 'Margem %', 'Food Cost'].map(H), ...sellable().filter((x) => x.p.current).sort((a, b) => b.p.current.profit - a.p.current.profit).map((x, i) => [i + 1, x.r.name, E(x.p.current.gross), E(x.p.current.contribution), E(x.p.current.profit), P(x.p.current.profitPct), P(x.p.current.foodCostPct)])] }) },
    fc: { title: 'Ranking dos pratos com maior Food Cost', desc: 'Ordenado pelo Food Cost do preço praticado',
      sheet: () => ({ name: 'Maior Food Cost', widths: [6, 34, 14, 14, 12, 12, 14], rows: [['#', 'Produto', 'Matérias/dose', 'PV s/IVA', 'Food Cost', 'Objetivo', 'Diferença (p.p.)'].map(H), ...sellable().filter((x) => x.p.current).sort((a, b) => b.p.current.foodCostPct - a.p.current.foodCostPct).map((x, i) => [i + 1, x.r.name, E(x.c.perDose.materials), E(x.p.current.net), P(x.p.current.foodCostPct), P(x.p.target), N(U.round(x.p.current.foodCostPct - x.p.target, 2))])] }) },
    evolucao: { title: 'Evolução dos custos de ingredientes', desc: 'Histórico de alterações de preço',
      sheet: () => { const hist = Repo.all('priceHistory').sort((a, b) => b.date.localeCompare(a.date)); return { name: 'Evolução', widths: [18, 34, 16, 16, 12, 14, 40], rows: [['Data', 'Ingrediente', 'Custo anterior', 'Custo novo', 'Variação', 'Origem', 'Fichas afetadas'].map(H), ...hist.map((x) => [U.fmtDateTime(x.date), x.ingredientName, E(x.oldUnitCost), E(x.newUnitCost), P(x.diffPct), x.source || '', x.impacts.map((i) => i.recipeName).join(', ')])] }; } },
    antesdepois: { title: 'Comparação de custos antes e depois de atualizações', desc: 'Impacto das alterações de preço nas fichas',
      sheet: () => { const rows = []; Repo.all('priceHistory').sort((a, b) => b.date.localeCompare(a.date)).forEach((x) => x.impacts.forEach((im) => rows.push([U.fmtDateTime(x.date), x.ingredientName, P(x.diffPct), im.recipeName, E(im.oldDose), E(im.newDose), E(im.newDose - im.oldDose), P(im.oldDose ? ((im.newDose - im.oldDose) / im.oldDose) * 100 : NaN)]))); return { name: 'Antes e depois', widths: [18, 30, 12, 30, 14, 14, 14, 12], rows: [['Data', 'Ingrediente', 'Var. ingrediente', 'Ficha', 'Custo/dose antes', 'Custo/dose depois', 'Diferença', 'Var. ficha'].map(H), ...rows] }; } },
    global: { title: 'Relatório global de rentabilidade', desc: 'Resumo por categoria e produtos com prejuízo',
      sheet: () => { const list = sellable().filter((x) => x.p.current); const cats = [...new Set(list.map((x) => x.r.category || '—'))]; const agg = (l) => [N(l.length), E(U.avg(l.map((x) => x.c.perDose.total))), E(U.avg(l.map((x) => x.p.current.gross))), P(U.avg(l.map((x) => x.p.current.foodCostPct))), E(U.avg(l.map((x) => x.p.current.contribution))), E(U.avg(l.map((x) => x.p.current.profit))), P(U.avg(l.map((x) => x.p.current.profitPct))), N(l.filter((x) => x.p.current.profit < 0).length)]; return { name: 'Rentabilidade', widths: [26, 10, 14, 14, 12, 16, 14, 12, 12], rows: [['Categoria', 'Produtos', 'Custo médio/dose', 'PV médio c/IVA', 'FC médio', 'Contribuição média', 'Lucro médio/dose', 'Margem média', 'Com prejuízo'].map(H), ...cats.map((c) => [c, ...agg(list.filter((x) => (x.r.category || '—') === c))]), ['TOTAL', ...agg(list)].map((v, i) => (i === 0 ? { v, t: 'head' } : v))] }; } },
  };
  function sheetsFor(key, rec) { const d = def[key]; return d.sheets ? d.sheets(rec) : [d.sheet()]; }
  function htmlFor(key, rec) {
    const d = def[key];
    if (d.html) return d.html(rec);
    if (d.printHtml) return d.printHtml();
    const sh = d.sheet();
    return header(d.title) + (sh.rows.length > 1 ? toHtmlTable(sh.rows) : '<p>Sem dados.</p>') + (key === 'global' ? lossList() : '') + foot();
  }
  function lossList() { const l = sellable().filter((x) => x.p.current && x.p.current.profit < 0); return `<h2>Produtos com prejuízo estimado</h2>${l.length ? toHtmlTable([['Produto', 'PV c/IVA', 'Custo total/dose', 'Lucro est./dose', 'PV recomendado'].map(H), ...l.map((x) => [x.r.name, E(x.p.current.gross), E(x.c.perDose.total), E(x.p.current.profit), E(x.p.recommended.gross)])]) : '<p>Nenhum.</p>'}`; }
  return {
    def, sheetsFor, htmlFor, ingredientsSheet, toHtmlTable,
    printRecipe: (rec, opts) => printHTML(recipeDoc(rec, opts), 'Ficha técnica - ' + rec.name),
    printAllergenSheet: (recs, opts) => printHTML(allergenDoc(recs, opts), 'Alergénios'),
  };
})();

/* ------------------------------ 10. RELATÓRIOS ------------------------------ */
const RepUI = { key: 'estiva', rec: '' };
Views.relatorios = (el) => {
  const recs = Repo.all('recipes').sort((a, b) => a.name.localeCompare(b.name, 'pt'));
  if (!RepUI.rec && recs.length) RepUI.rec = recs[0].id;
  el.innerHTML = `<div class="rep-cards">${Object.entries(Reports.def).map(([k, d]) => `<div class="rep-card ${RepUI.key === k ? 'active' : ''}" data-rep="${k}"><b>${h(d.title)}</b><span class="small muted">${h(d.desc)}</span></div>`).join('')}</div>
    <div class="card" style="margin-top:16px"><div class="toolbar">${Reports.def[RepUI.key].needsRecipe ? `<select id="rrec">${options(recs.map((r) => [r.id, r.name]), RepUI.rec)}</select>` : ''}<span class="grow"></span>
      <button class="btn primary" id="rpdf">🖨 Imprimir / PDF</button><button class="btn" id="rxl">⤓ Excel</button><button class="btn" id="rcsv">⤓ CSV</button></div>
      <div class="small muted">Para PDF, escolha "Guardar como PDF" na janela de impressão do navegador.</div><div class="sep"></div><div id="rprev" class="print-doc"></div></div>`;
  const rec = () => Repo.get('recipes', RepUI.rec);
  const need = Reports.def[RepUI.key].needsRecipe;
  const draw = () => { if (need && !rec()) { $('#rprev', el).innerHTML = '<div class="empty">Crie uma ficha técnica primeiro.</div>'; return; } $('#rprev', el).innerHTML = Reports.htmlFor(RepUI.key, rec()); };
  $$('[data-rep]', el).forEach((c) => (c.onclick = () => { RepUI.key = c.dataset.rep; Views.relatorios(el); }));
  const rr = $('#rrec', el); if (rr) rr.onchange = () => { RepUI.rec = rr.value; draw(); };
  const guard = () => { if (need && !rec()) { toast('Escolha uma ficha', 'err'); return false; } return true; };
  const name = () => (need ? 'ficha_' + U.normalize(rec().name).replace(/ /g, '-') : RepUI.key);
  $('#rpdf', el).onclick = () => guard() && printHTML(Reports.htmlFor(RepUI.key, rec()), Reports.def[RepUI.key].title);
  $('#rxl', el).onclick = () => guard() && exportRows('xlsx', name(), Reports.sheetsFor(RepUI.key, rec()));
  $('#rcsv', el).onclick = () => guard() && exportRows('csv', name(), Reports.sheetsFor(RepUI.key, rec()));
  draw();
};

/* ------------------------------ ARRANQUE ------------------------------ */
(async function boot() {
  $('#view').innerHTML = '<div class="empty">A carregar…</div>';
  try { await Repo.init(); }
  catch (e) { $('#view').innerHTML = `<div class="alert err">Não foi possível abrir o armazenamento local: ${h(e.message)}</div>`; return; }
  const st = Repo.get('meta', 'settings');
  if (!st) { await saveSettings({ firstRun: U.nowISO() }); if (!Repo.all('ingredients').length && !Repo.all('recipes').length) await Demo.load(); }
  Repo.on(() => {});
  $('#menuBtn').onclick = () => $('#sidebar').classList.toggle('open');
  $('#quickBackup').onclick = backupDownload;
  document.addEventListener('click', (e) => { if (window.innerWidth <= 820 && !e.target.closest('#sidebar') && !e.target.closest('#menuBtn')) $('#sidebar').classList.remove('open'); });
  window.addEventListener('storage', () => {});
  route();
})();

</script>
</body></html>
